name: rust
description: "Rust toolchain via rustup"
depends_on:
  - base
scripts:
  - mode: user
    script: |
      if command -v rustc >/dev/null 2>&1; then
        echo "Rust already installed: $(rustc --version)"
        exit 0
      fi
      curl -fsSL "https://sh.rustup.rs" -o /tmp/rustup-init.sh
      echo "a8bfc79a0b85e995a99be6e6e1e3e88ac96e55a2dc11e0cf9e15bfc55d96a40a  /tmp/rustup-init.sh" | sha256sum -c -
      sh /tmp/rustup-init.sh -y --default-toolchain stable
      rm -f /tmp/rustup-init.sh
  - mode: user
    script: |
      grep -q 'cargo/env' ~/.profile 2>/dev/null || \
        echo '. "$HOME/.cargo/env"' >> ~/.profile
      grep -q 'cargo/env' ~/.bashrc 2>/dev/null || \
        echo '. "$HOME/.cargo/env"' >> ~/.bashrc
checksums:
  rustup-init.sh: "a8bfc79a0b85e995a99be6e6e1e3e88ac96e55a2dc11e0cf9e15bfc55d96a40a"
probe:
  command: "command -v rustc"
  interval: 5s
  timeout: 5m
