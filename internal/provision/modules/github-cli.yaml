name: github-cli
description: "GitHub CLI (gh)"
depends_on:
  - base
scripts:
  - mode: system
    script: |
      if command -v gh >/dev/null 2>&1; then
        echo "GitHub CLI already installed: $(gh --version)"
        exit 0
      fi
      ARCH="$(dpkg --print-architecture)"
      GH_VERSION="2.67.0"
      curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${ARCH}.tar.gz" \
        -o /tmp/gh.tar.gz
      echo "${GH_CHECKSUM}  /tmp/gh.tar.gz" | sha256sum -c -
      tar -C /tmp -xzf /tmp/gh.tar.gz
      cp /tmp/gh_${GH_VERSION}_linux_${ARCH}/bin/gh /usr/local/bin/gh
      rm -rf /tmp/gh.tar.gz /tmp/gh_${GH_VERSION}_linux_${ARCH}
checksums:
  gh_2.67.0_linux_arm64.tar.gz: "2b9e48a0eb2e8a1e7e9b9c84b0e0c9e610e8aefb93d0860e3be2272fbdc67f3e"
  gh_2.67.0_linux_amd64.tar.gz: "3e0b1e8c48ec8e2a57b3e8b9c3c94c18dc773f9f123f1db8f5fc3c2b0a0f0a9a"
probe:
  command: "gh --version"
  interval: 5s
  timeout: 3m
