name: egress
description: "Default-deny egress firewall (iptables/ip6tables): blocks all outbound traffic except allowlisted destinations and SSH"
depends_on:
  - base
  - dns-filter
scripts:
  - mode: system
    script: |
      # REQ-004-006: Default-deny outbound network policy
      # REQ-004-009: Egress implementation via iptables
      # Only traffic to explicitly allowlisted destinations is permitted.
      export DEBIAN_FRONTEND=noninteractive
      # Ensure package index is available (may have been cleared)
      if [ ! -d /var/lib/apt/lists ] || [ -z "$(ls /var/lib/apt/lists/ 2>/dev/null)" ]; then
        apt-get update -qq
      fi
      apt-get install -y --no-install-recommends iptables iptables-persistent
      # Flush existing sd-egress chain if present (idempotent re-provisioning)
      iptables -F sd-egress 2>/dev/null || true
      iptables -D OUTPUT -j sd-egress 2>/dev/null || true
      iptables -X sd-egress 2>/dev/null || true
      # Create dedicated chain for manageability
      iptables -N sd-egress
      iptables -A OUTPUT -j sd-egress
      # Allow loopback
      iptables -A sd-egress -o lo -j ACCEPT
      # Allow established connections (response traffic)
      iptables -A sd-egress -m state --state ESTABLISHED,RELATED -j ACCEPT
      # Allow DNS to local filtering resolver ONLY (REQ-004-025)
      # dnsmasq listens on 127.0.0.1:53
      iptables -A sd-egress -p udp --dport 53 -d 127.0.0.1 -j ACCEPT
      iptables -A sd-egress -p tcp --dport 53 -d 127.0.0.1 -j ACCEPT
      # Allow dnsmasq to reach upstream DNS server
      UPSTREAM_DNS=$(grep -m1 '^nameserver' /etc/resolv.conf.bak.sd 2>/dev/null | awk '{print $2}')
      if [ -n "$UPSTREAM_DNS" ]; then
        iptables -A sd-egress -p udp --dport 53 -d "$UPSTREAM_DNS" -j ACCEPT
        iptables -A sd-egress -p tcp --dport 53 -d "$UPSTREAM_DNS" -j ACCEPT
      fi
      # Block DNS to all other resolvers
      iptables -A sd-egress -p udp --dport 53 -j DROP
      iptables -A sd-egress -p tcp --dport 53 -j DROP
      # Block DNS-over-TLS (port 853) unless destination is on allowlist
      # REQ-004-025: Prevent DNS exfiltration via TLS
      iptables -A sd-egress -p tcp --dport 853 -j DROP
      # Block DNS-over-HTTPS to known DoH providers (REQ-004-025)
      iptables -A sd-egress -p tcp --dport 443 -d 8.8.8.8 -j DROP
      iptables -A sd-egress -p tcp --dport 443 -d 8.8.4.4 -j DROP
      iptables -A sd-egress -p tcp --dport 443 -d 1.1.1.1 -j DROP
      iptables -A sd-egress -p tcp --dport 443 -d 1.0.0.1 -j DROP
      iptables -A sd-egress -p tcp --dport 443 -d 9.9.9.9 -j DROP
      iptables -A sd-egress -p tcp --dport 443 -d 149.112.112.112 -j DROP
      # Allow SSH from host (required for sd operation)
      # SSH traffic from the host uses source port from the host side
      iptables -A sd-egress -p tcp --sport 22 -j ACCEPT
      # Per-domain ACCEPT rules: resolve default egress allowlist and add rules
      # REQ-004-007: Default egress allowlist
      # Wait briefly for dnsmasq to be ready
      sleep 2
      for domain in api.anthropic.com github.com archive.ubuntu.com security.ubuntu.com deb.debian.org registry.npmjs.org pypi.org files.pythonhosted.org proxy.golang.org sum.golang.org; do
        for ip in $(dig +short "$domain" @127.0.0.1 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'); do
          iptables -A sd-egress -d "$ip" -j ACCEPT
        done
      done
      # Resolve common subdomains for wildcard patterns
      for domain in raw.githubusercontent.com objects.githubusercontent.com; do
        for ip in $(dig +short "$domain" @127.0.0.1 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'); do
          iptables -A sd-egress -d "$ip" -j ACCEPT
        done
      done
      # Default deny all other outbound traffic
      iptables -A sd-egress -j DROP
      # Persist iptables rules across reboots
      if command -v iptables-save >/dev/null 2>&1; then
        iptables-save > /etc/iptables/rules.v4 2>/dev/null || true
      fi
      # REQ-004-009: Block all IPv6 egress to prevent security bypass
      # IPv6 is not required for agent workloads and could bypass IPv4 egress controls
      ip6tables -F sd-egress-v6 2>/dev/null || true
      ip6tables -D OUTPUT -j sd-egress-v6 2>/dev/null || true
      ip6tables -X sd-egress-v6 2>/dev/null || true
      ip6tables -N sd-egress-v6
      ip6tables -A OUTPUT -j sd-egress-v6
      # Allow IPv6 loopback
      ip6tables -A sd-egress-v6 -o lo -j ACCEPT
      # Allow established connections
      ip6tables -A sd-egress-v6 -m state --state ESTABLISHED,RELATED -j ACCEPT
      # Block all other IPv6 traffic
      ip6tables -A sd-egress-v6 -j DROP
      # Persist ip6tables rules
      if command -v ip6tables-save >/dev/null 2>&1; then
        ip6tables-save > /etc/iptables/rules.v6 2>/dev/null || true
      fi
  - mode: system
    script: |
      # REQ-004-010: Periodic DNS re-resolution for egress allowlist
      # Install refresh script (root-owned, not user-writable)
      cat > /usr/local/sbin/sd-egress-refresh << 'REFRESH_SCRIPT'
      #!/bin/bash
      set -eu -o pipefail

      DOMAINS="api.anthropic.com github.com archive.ubuntu.com security.ubuntu.com deb.debian.org registry.npmjs.org pypi.org files.pythonhosted.org proxy.golang.org sum.golang.org raw.githubusercontent.com objects.githubusercontent.com"

      # Flush and rebuild sd-egress chain.
      # Immediately add DROP so we are never open during rebuild.
      iptables -F sd-egress
      iptables -A sd-egress -j DROP

      # Insert ACCEPT rules before the trailing DROP (rule number 1, pushing DROP down).
      RULE=1

      # Loopback
      iptables -I sd-egress "$RULE" -o lo -j ACCEPT
      RULE=$((RULE + 1))

      # Established/related connections (preserves existing sessions per REQ-004-010)
      iptables -I sd-egress "$RULE" -m state --state ESTABLISHED,RELATED -j ACCEPT
      RULE=$((RULE + 1))

      # DNS to local filtering resolver only (REQ-004-025)
      iptables -I sd-egress "$RULE" -p udp --dport 53 -d 127.0.0.1 -j ACCEPT
      RULE=$((RULE + 1))
      iptables -I sd-egress "$RULE" -p tcp --dport 53 -d 127.0.0.1 -j ACCEPT
      RULE=$((RULE + 1))

      # Allow dnsmasq to reach upstream DNS
      UPSTREAM_DNS=$(grep -m1 '^nameserver' /etc/resolv.conf.bak.sd 2>/dev/null | awk '{print $2}')
      if [ -n "$UPSTREAM_DNS" ]; then
        iptables -I sd-egress "$RULE" -p udp --dport 53 -d "$UPSTREAM_DNS" -j ACCEPT
        RULE=$((RULE + 1))
        iptables -I sd-egress "$RULE" -p tcp --dport 53 -d "$UPSTREAM_DNS" -j ACCEPT
        RULE=$((RULE + 1))
      fi

      # Block DNS to all other resolvers
      iptables -I sd-egress "$RULE" -p udp --dport 53 -j DROP
      RULE=$((RULE + 1))
      iptables -I sd-egress "$RULE" -p tcp --dport 53 -j DROP
      RULE=$((RULE + 1))

      # Block DNS-over-TLS (port 853)
      iptables -I sd-egress "$RULE" -p tcp --dport 853 -j DROP
      RULE=$((RULE + 1))

      # Block DNS-over-HTTPS to known DoH providers
      for doh_ip in 8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1 9.9.9.9 149.112.112.112; do
        iptables -I sd-egress "$RULE" -p tcp --dport 443 -d "$doh_ip" -j DROP
        RULE=$((RULE + 1))
      done

      # SSH from host
      iptables -I sd-egress "$RULE" -p tcp --sport 22 -j ACCEPT
      RULE=$((RULE + 1))

      # Re-resolve allowlisted domains and add ACCEPT rules
      for domain in $DOMAINS; do
        for ip in $(dig +short "$domain" @127.0.0.1 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'); do
          iptables -I sd-egress "$RULE" -d "$ip" -j ACCEPT
          RULE=$((RULE + 1))
        done
      done

      # Persist updated rules
      iptables-save > /etc/iptables/rules.v4 2>/dev/null || true

      logger -t sd-egress "Refreshed egress rules ($((RULE - 1)) accept rules)"
      REFRESH_SCRIPT
      chmod 700 /usr/local/sbin/sd-egress-refresh
      chown root:root /usr/local/sbin/sd-egress-refresh

      # Install systemd service for the refresh script
      cat > /etc/systemd/system/sd-egress-refresh.service << 'SVC'
      [Unit]
      Description=Refresh sd egress firewall rules with current DNS

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/sd-egress-refresh
      SVC

      # Install systemd timer (5-minute interval per REQ-004-010)
      cat > /etc/systemd/system/sd-egress-refresh.timer << 'TMR'
      [Unit]
      Description=Periodic sd egress firewall refresh

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=5min

      [Install]
      WantedBy=timers.target
      TMR

      systemctl daemon-reload
      systemctl enable --now sd-egress-refresh.timer
probe:
  command: "iptables -L sd-egress -n 2>/dev/null | grep -q 'sd-egress' && ip6tables -L sd-egress-v6 -n 2>/dev/null | grep -q 'sd-egress-v6'"
  interval: 5s
  timeout: 30s
